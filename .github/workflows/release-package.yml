name: release-package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-package.yml
  workflow_dispatch:

# The v0.1.0 release already exists. Reruns audit it; they never republish it.
# A missing or mismatched asset is an explicit release-recovery incident, not
# permission to replace a published artifact from a mutable workflow.
permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable v0.1.0 source
        uses: actions/checkout@v5
        with:
          ref: ba8f475db25c5458451fabaa349f939fb2bc4b9d
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag still points to approved source
        run: |
          test "$(git rev-parse HEAD)" = "ba8f475db25c5458451fabaa349f939fb2bc4b9d"
          test "$(git rev-parse 'refs/tags/v0.1.0^{commit}')" = "ba8f475db25c5458451fabaa349f939fb2bc4b9d"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and import source wheel (not a publication)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fuckup_protocol as f; print(f.PostgresExecutionStore.__name__, f.ReferenceFileInjector.__name__)"
          sha256sum dist/*.whl

      - name: Verify existing published assets, never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download v0.1.0 --dir "$RUNNER_TEMP/published"
          python - "$RUNNER_TEMP/published" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          directory = Path(sys.argv[1])
          expected = {
              "fuckup_protocol-0.1.0-py3-none-any.whl": "fdd183c6460fbf22918999a017fd1d10c18e1fd28b94eb511177266c46f57a28",
              "SHA256SUMS.txt": "928a7119c138501f44240497831c2153640fa0a58a5a4dc82ac0e7be94692f9d",
          }
          found = {entry.name for entry in directory.iterdir() if entry.is_file()}
          if found != set(expected):
              raise SystemExit(f"release asset inventory mismatch: expected {sorted(expected)}, found {sorted(found)}")
          for name, digest in expected.items():
              actual = sha256((directory / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"published asset digest mismatch: {name}")
          # Original release manifest was produced by `sha256sum dist/*.whl`.
          wheel_line = f"{expected['fuckup_protocol-0.1.0-py3-none-any.whl']}  dist/fuckup_protocol-0.1.0-py3-none-any.whl"
          checksum_text = (directory / "SHA256SUMS.txt").read_text(encoding="utf-8").strip()
          if checksum_text != wheel_line:
              raise SystemExit("published checksum manifest does not match the approved wheel digest")
          print("v0.1.0 release assets verified; no publication or mutation performed")
          PY
