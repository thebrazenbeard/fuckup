name: release-package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: v0.1.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fuckup_protocol as f; print(f.PostgresExecutionStore.__name__, f.ReferenceFileInjector.__name__)"
          sha256sum dist/*.whl > dist/SHA256SUMS.txt

      - name: Upload package assets to v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 dist/*.whl dist/SHA256SUMS.txt --clobber
