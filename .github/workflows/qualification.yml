name: qualification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FUCKUP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,postgres-test]"

      - name: Run full qualification
        run: python -m pytest -q

      - name: Check patch hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
