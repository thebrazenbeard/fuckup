[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fuckup-protocol"
version = "0.1.0"
description = "Vendor-neutral corrective-learning protocol runtime"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "jsonschema>=4.23",
]
postgres-test = [
  "pytest>=8.0",
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
